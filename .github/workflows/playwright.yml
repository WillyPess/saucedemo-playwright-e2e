name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --project=chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Assemble GitHub Pages site
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      run: |
        mkdir -p site/report site/test-plan
        cp -r playwright-report/. site/report/
        cp -r test-plan/. site/test-plan/
        cat > site/index.html <<'EOF'
        <!doctype html>
        <html>
        <head><meta charset="utf-8"><title>Sauce Labs E2E Suite</title></head>
        <body>
          <h1>Sauce Labs E2E Suite</h1>
          <ul>
            <li><a href="test-plan/">Test Plan &amp; Bug Registry</a></li>
            <li><a href="report/">Latest Playwright HTML Report</a></li>
          </ul>
        </body>
        </html>
        EOF
    - name: Publish to GitHub Pages
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: site
        publish_branch: gh-pages
